# Blueprint de Render: crea la base de datos y el servicio web juntos.
# En Render: New → Blueprint → elige este repositorio.
databases:
  - name: achirana-db
    plan: free            # gratis: vence a los 30 días; luego hay que pasarla a un plan pagado
    databaseName: achirana
    user: achirana

services:
  - type: web
    name: achirana
    runtime: node
    plan: free            # gratis: se duerme tras 15 min sin visitas (la primera carga tarda)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: achirana-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INICIAL_EMAIL
        sync: false       # Render te lo pide al crear el Blueprint
      - key: ADMIN_INICIAL_PASS
        sync: false
      - key: GERENTE_INICIAL_PASS
        sync: false
      - key: PAGOS_DEMO
        value: "true"     # cobros simulados para presentar; pon "false" al cobrar de verdad
